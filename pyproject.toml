[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-security"
version = "0.1.0"
description = "Companion code for the AI Data Security series: detection, tokenization, the wire, RAG and memory, policy and audit."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Govinda Reddy Vepanjeri" }]
requires-python = ">=3.10"
# Verified with presidio-analyzer/anonymizer 2.2.364, spaCy 3.8.16,
# en_core_web_lg 3.8.0 (September 2026). Detector scores move between
# releases; pin these if you want the printed outputs to reproduce exactly.
dependencies = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.16",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
